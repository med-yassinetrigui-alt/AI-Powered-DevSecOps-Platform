name: Build and Push to Docker Hub

on:
  push:
    branches:
      - main
  workflow_dispatch: # Permet de lancer le workflow manuellement

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-backend:latest ./backend
          docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-backend:latest

      - name: Build & Push Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/devsecops-frontend:latest ./frontend
          docker push ${{ secrets.DOCKER_USERNAME }}/devsecops-frontend:latest
